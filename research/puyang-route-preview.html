<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>浦阳江路线开发预览</title><style>body{max-width:1040px;margin:auto;padding:24px;font:16px/1.7 system-ui,sans-serif;color:#172b4d;background:#f4f6f8}h1{font-size:28px;line-height:1.3}.status{color:#92400e}section{background:white;padding:20px;border-radius:12px;margin:20px 0}img{width:100%;height:auto}a{color:#0d6576;overflow-wrap:anywhere}li{margin:10px 0}h2{font-size:21px}small{color:#5c6b7d}@media(max-width:500px){body{padding:14px}section{padding:14px}h1{font-size:24px}}</style><body>
<p class="status">开发草案 · 未正式收录 · 不属于 V 1.0.1 已发布内容</p><h1 id="title"></h1><p id="summary"></p><p id="intro"></p><img src="../maps/puyang-greenway-draft.svg" alt="浦阳江16.7公里开发方案地图，含条件待确认的车场P和道路起点S">
<section><h2>先确认停车，再卸车出发</h2><h3 id="parking"></h3><p id="address"></p><p id="rule"></p><p id="condition"></p><p id="precision"></p><a id="amap">高德 · 查看具名车场 ↗</a>　<a id="baidu">百度 · 查看停车出入口 ↗</a><p class="status">完整取车窗口未查到。是否按“参考免费、入场确认”正式收录，等待用户选择。</p></section>
<section><h2>路线与接驳</h2><ol id="stops"></ol><p id="lane"></p></section><section><h2>起终点周边的可选停留</h2><ul id="food"></ul><small>以上是平台场所信息，不代表实吃或当日营业确认；探店绕行不计主线。</small></section><section><h2>出行边界</h2><ul id="notes"></ul></section>
<script src="../map-data.js"></script><script src="../catalog.js"></script><script src="../planning-data.js"></script><script src="../regional-map-data.js"></script><script src="../verified-map-data.js"></script><script src="../puyang-map-data.js"></script><script src="../puyang-catalog.js"></script><script>
const r=PUYANG_ROUTE_DRAFT,set=(id,text)=>document.getElementById(id).textContent=text;
set('title',r.title);set('summary',`${r.distance} km · ${r.duration} · 已含双程约1.52km停车接驳`);set('intro',r.description);set('parking',r.parking.name);set('address',r.parking.address);set('rule',r.parking.rule);set('condition',r.parking.condition);set('precision',r.parking.precision);set('lane',r.laneDetail);document.getElementById('amap').href=r.parking.source;document.getElementById('baidu').href=r.sources[1][1];
for(const [id,values]of [['stops',r.stops.map(s=>s.name+'：'+s.note)],['notes',r.notes]])for(const text of values){let li=document.createElement('li');li.textContent=text;document.getElementById(id).append(li)}
for(const f of r.food){let li=document.createElement('li'),a=document.createElement('a');a.textContent=f.name;a.href=f.source;li.append(a,document.createTextNode(' · '+f.location+'。'+f.description));document.getElementById('food').append(li)}
</script></body></html>
