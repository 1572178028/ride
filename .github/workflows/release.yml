# Publish the validated version tag; reconcile maintained release notes from main.
name: Publish versioned release
on:
  push:
    branches: [main]
    paths:
      - version.json
      - research/releases/**
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-versioned-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Use project-supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version, tag, tests and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone "$GH_REPO" source
          cd source
          git checkout --detach "$SOURCE_SHA"
          version=$(node -p "require('./version.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          git merge-base --is-ancestor "$tag" HEAD
          tagged_version=$(git show "$tag:version.json" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>process.stdout.write(JSON.parse(s).version))")
          test "$tagged_version" = "$version"
          npm test
          touch /tmp/previous-release-notes.md
          if gh release view "$tag" --json body --jq .body > /tmp/previous-release-notes.md; then
            node scripts/lib/release-notes.cjs /tmp/previous-release-notes.md "research/releases/$tag.md" "$GH_REPO" "$SOURCE_SHA" /tmp/release-notes.md
            gh release edit "$tag" --notes-file /tmp/release-notes.md
          else
            node scripts/lib/release-notes.cjs /tmp/previous-release-notes.md "research/releases/$tag.md" "$GH_REPO" "$SOURCE_SHA" /tmp/release-notes.md
            gh release create "$tag" --verify-tag --title "V $version" --notes-file /tmp/release-notes.md
          fi
